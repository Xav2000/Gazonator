<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gazonator - Interface Mower Web</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
    #tabs { display: flex; background: #f1f1f1; padding: 10px; border-bottom: 1px solid #ddd; }
    .tab { padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-right: 10px; transition: all 0.3s; }
    .tab:hover { background: #ddd; }
    .tab.active { background: #4CAF50; color: white; }
    .tab-content { display: none; height: calc(100vh - 60px); }
    .tab-content.active { display: block; }
    #map-taches { width: 70%; height: 100%; float: left; background: #f8f8f8; }
    #sidebar { width: 30%; height: 100%; float: right; background: white; border-left: 1px solid #ddd; overflow-y: auto; padding: 10px; }
    #zones-list { height: 50%; border-bottom: 1px solid #eee; margin-bottom: 10px; overflow-y: auto; }
    .zone-item { padding: 8px; margin-bottom: 5px; border: 1px solid #eee; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    button { padding: 8px 12px; margin: 5px 0; border: none; border-radius: 4px; cursor: pointer; background: #4CAF50; color: white; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div id="tabs">
    <div class="tab active" onclick="switchTab('pilotage')">🎮 Pilotage</div>
    <div class="tab" onclick="switchTab('mission')">🗺️ Mission</div>
    <div class="tab" onclick="switchTab('taches')">✏️ Tâches</div>
    <div class="tab" onclick="switchTab('sante')">💓 Santé</div>
  </div>
  <div id="pilotage-tab" class="tab-content active"><div id="joystick-zone" style="width:250px;height:250px;margin:20px auto;border:2px solid #ccc;border-radius:50%;"></div><button onclick="startArpentageMode()">🚜 Mode Arpentage</button><button onclick="stopArpentageMode()">⏹️ Arrêter</button><div id="map-pilotage" style="height:50vh;margin:10px 0;"></div><div id="camera-feed" style="height:200px;background:#333;color:white;display:flex;justify-content:center;align-items:center;">📹 Flux vidéo (à venir)</div></div>
  <div id="mission-tab" class="tab-content" style="display:none;"><div id="map-mission" style="height:100%;"></div></div>
  <div id="taches-tab" class="tab-content" style="display:none;"><div id="map-taches" style="width:70%;height:100%;float:left;"></div><div id="sidebar" style="width:30%;height:100%;float:right;background:white;border-left:1px solid #ddd;overflow-y:auto;padding:10px;"><h2>✏️ Éditeur</h2><div id="zones-list"><h3>Zones</h3><div id="zones-container"></div></div><div id="settings-panel"><h3>Paramètres</h3><div id="settings-container"><p>Sélectionnez une zone.</p></div></div><button onclick="saveAllZones()">💾 Sauvegarder</button><button onclick="generateAllLines()">📐 Générer Lignes</button></div></div>
  <div id="sante-tab" class="tab-content" style="display:none;"><h2>💓 Santé</h2><div id="system-status"></div></div>
  <script>
    let mapPilotage, mapMission, mapTaches, drawnItems, zones = [], currentZone, arpentageMode = false, arpentagePath = [], socket, currentTab = 'pilotage';
    document.addEventListener('DOMContentLoaded', () => { initTabs(); initPilotage(); initMission(); initTaches(); initSante(); connectSocket(); loadAllData(); });
    function initTabs() { mapPilotage = L.map('map-pilotage').setView([48.8566, 2.3522], 18); mapMission = L.map('map-mission').setView([48.8566, 2.3522], 18); mapTaches = L.map('map-taches').setView([48.8566, 2.3522], 18); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapPilotage); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapMission); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapTaches); }
    function switchTab(tabName) { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active'); document.getElementById(`${tabName}-tab`).classList.add('active'); currentTab = tabName; if (tabName === 'taches') { renderAllZonesOnMap(); updateZonesList(); } else if (tabName === 'sante') { updateSystemStatus(); } }
    function initPilotage() { const j = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: { left: '50%', top: '50%' } }); j.on('move', (e,d) => sendROSCommand({ type: 'manual_control', linear_x: Math.cos(d.angle.radian) * Math.min(d.distance/100,1), angular_z: 0 })); j.on('end', () => sendROSCommand({ type: 'stop' })); document.addEventListener('keydown', (e) => { if (currentTab !== 'pilotage') return; const c = { ArrowUp: {linear_x:0.3,angular_z:0}, ArrowDown: {linear_x:-0.3,angular_z:0}, ArrowLeft: {linear_x:0,angular_z:0.5}, ArrowRight: {linear_x:0,angular_z:-0.5} }; if (c[e.key]) sendROSCommand(c[e.key]); }); document.addEventListener('keyup', (e) => { if (currentTab !== 'pilotage' && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) sendROSCommand({ type: 'stop' }); }); }
    function startArpentageMode() { arpentageMode = true; arpentagePath = []; alert('Mode Arpentage activé!'); }
    function stopArpentageMode() { arpentageMode = false; if (arpentagePath.length > 2) { zones.push({ id: `zone_${Date.now()}`, name: `Zone ${zones.filter(z=>z.type==='mowing').length+1}`, type: 'mowing', polygon: arpentagePath, lines: [], parameters: {speed:0.5,height:5,mowingWidth:0.5,overlap:0.1}, selected: false }); updateZonesList(); renderAllZonesOnMap(); saveAllZones(); } arpentagePath = []; }
    function simulatePositionUpdate() { if (!arpentageMode) return; if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => { const np = [p.coords.longitude, p.coords.latitude]; arpentagePath.push(np); if (arpentagePath.length > 1) { if (window.arpentageLayer) mapTaches.removeLayer(window.arpentageLayer); window.arpentageLayer = L.polyline(arpentagePath, {color:'red'}).addTo(mapTaches); } }); }
    setInterval(simulatePositionUpdate, 500);
    function initTaches() { drawnItems = new L.FeatureGroup(); mapTaches.addLayer(drawnItems); const dc = new L.Control.Draw({ edit: {featureGroup: drawnItems, poly: {allowIntersection: false}}, draw: {polygon: true, polyline: true, rectangle: false, circle: false, marker: false} }); mapTaches.addControl(dc); mapTaches.on(L.Draw.Event.CREATED, e => { const l = e.layer; drawnItems.addLayer(l); let t = e.layerType === 'polyline' ? 'corridor' : 'mowing'; if (e.layerType === 'polygon') t = prompt('Type:', 'mowing') || 'mowing'; const nz = {id:`zone_${Date.now()}`,name:`Zone ${zones.filter(z=>z.type==='mowing').length+1}`,type:t,geometry:l.toGeoJSON().geometry,lines:[],parameters:getDefaultParameters(t),selected:false}; l.options.zoneId = nz.id; l.on('click',()=>selectZone(nz.id)); zones.push(nz); updateZonesList(); saveAllZones(); }); mapTaches.on('draw:edited', e => { e.layers.eachLayer(l => { const z = zones.find(z=>z.id===l.options.zoneId); if(z){z.geometry=l.toGeoJSON().geometry;saveAllZones();} }); }); mapTaches.on('draw:deleted', e => { e.layers.eachLayer(l => { const i = zones.findIndex(z=>z.id===l.options.zoneId); if(i!==-1){zones.splice(i,1);updateZonesList();saveAllZones();} }); }); }
    function getDefaultParameters(t) { const d = {mowing:{speed:0.5,height:5,mowingWidth:0.5,overlap:0.1},obstacle:{buffer:0.5},corridor:{width:1.5,speed:0.3}}; return d[t]||{}; }
    function selectZone(zid) { if(currentZone){ const pl=findLayerByZoneId(currentZone.id); if(pl) pl.setStyle({color:getZoneColor(currentZone.type)}); } currentZone=zones.find(z=>z.id===zid); if(currentZone){ const l=findLayerByZoneId(zid); if(l) l.setStyle({color:'#FF9800',weight:3}); updateSettingsPanel(currentZone); } }
    function findLayerByZoneId(zid) { let r=null; drawnItems.eachLayer(l=>{if(l.options.zoneId===zid) r=l;}); return r; }
    function getZoneColor(t) { const c={mowing:'#4CAF50',obstacle:'#F44336',corridor:'#2196F3'}; return c[t]||'#9E9E9E'; }
    function updateZonesList() { const zc=document.getElementById('zones-container'); zc.innerHTML=''; const mz=zones.filter(z=>z.type==='mowing'); if(mz.length===0){zc.innerHTML='<p>Aucune zone.</p>';return;} mz.forEach(z=>{ const zi=document.createElement('div'); zi.className=`zone-item ${z.selected?'selected':''}`; zi.innerHTML=`<input type="checkbox" id="zone-${z.id}" ${z.selected?'checked':''}><label for="zone-${z.id}">${z.name}</label><button onclick="centerOnZone('${z.id}')">📍</button><button onclick="editZone('${z.id}')">✏️</button><button onclick="deleteZone('${z.id}')">🗑️</button>`; zc.appendChild(zi); document.getElementById(`zone-${z.id}`).addEventListener('change',e=>{z.selected=e.target.checked;if(e.target.checked)sendZoneToMission(z.id);}); }); }
    function centerOnZone(zid) { const z=zones.find(z=>z.id===zid); if(z){ const l=findLayerByZoneId(zid); if(l) mapTaches.fitBounds(l.getBounds()); } }
    function editZone(zid) { selectZone(zid); const z=zones.find(z=>z.id===zid); if(z){ const l=findLayerByZoneId(zid); if(l && (l instanceof L.Polygon || l instanceof L.Polyline)) l.enableEdit(); } }
    function deleteZone(zid) { if(!confirm('Supprimer?'))return; const i=zones.findIndex(z=>z.id===zid); if(i!==-1){ const l=findLayerByZoneId(zid); if(l) drawnItems.removeLayer(l); zones.splice(i,1); updateZonesList(); saveAllZones(); } }
    function updateSettingsPanel(z) { const sc=document.getElementById('settings-container'); if(!z){sc.innerHTML='<p>Sélectionnez une zone.</p>';return;} let h=`<div class="settings-group"><label>Nom:</label><input type="text" id="zone-name" value="${z.name||''}"></div>`; if(z.type==='mowing'){ h+=`<div class="settings-group"><label>Vitesse:</label><input type="range" id="mowing-speed" min="0.1" max="1" step="0.1" value="${z.parameters?.speed||0.5}"><span>${z.parameters?.speed||0.5}</span></div><button onclick="saveZoneParameters('${z.id}')">💾</button><button onclick="generateLines('${z.id}')">📐</button>`; } sc.innerHTML=h; }
    function saveZoneParameters(zid) { const z=zones.find(z=>z.id===zid); if(!z)return; if(z.type==='mowing') z.parameters={speed:parseFloat(document.getElementById('mowing-speed').value),height:parseInt(document.getElementById('cutting-height').value),mowingWidth:parseFloat(document.getElementById('mowing-width').value),overlap:parseFloat(document.getElementById('mowing-overlap').value)/100}; z.name=document.getElementById('zone-name').value||z.name; saveAllZones(); updateZonesList(); }
    function generateLines(zid) { const z=zones.find(z=>z.id===zid); if(!z||z.type!=='mowing')return; const lines=generateMowingLines(z); z.lines=lines; renderZoneLines(zid,lines); saveAllZones(); alert(`✅ ${lines.length} lignes générées!`); }
    function generateMowingLines(z) { const lines=[]; const poly=turf.polygon(z.geometry.coordinates); const bbox=turf.bbox(poly); const [minX,minY,maxX,maxY]=bbox; const spacing=z.parameters?.mowingWidth||0.5; const overlap=z.parameters?.overlap||0.1; const effSpacing=spacing*(1-overlap); const spacingDeg=effSpacing*0.000008983; for(let y=minY;y<=maxY;y+=spacingDeg){ const line=turf.lineString([[minX,y],[maxX,y]]); const inter=turf.intersect(line,poly); if(inter){ if(inter.geometry.type==='LineString') lines.push(inter.geometry.coordinates); else if(inter.geometry.type==='MultiLineString') inter.geometry.coordinates.forEach(c=>lines.push(c)); } } return lines; }
    function renderZoneLines(zid,lines) { const z=zones.find(z=>z.id===zid); if(!z)return; if(z.linesLayer) mapTaches.removeLayer(z.linesLayer); const ll=L.featureGroup(); lines.forEach((lc,i)=>{ const l=L.polyline(lc,{color:'#9C27B0',weight:2,opacity:0.7,dashArray:'5,5'}); l.options.zoneId=zid; l.options.lineIndex=i; ll.addLayer(l); }); z.linesLayer=ll; ll.addTo(mapTaches); }
    function renderAllZonesOnMap() { drawnItems.clearLayers(); zones.forEach(z=>{ if(z.geometry){ let l; if(z.geometry.type==='Polygon') l=L.geoJSON(z.geometry,{style:{color:getZoneColor(z.type),weight:2,fillOpacity:0.2}}).getLayers()[0]; else if(z.geometry.type==='LineString') l=L.geoJSON(z.geometry,{style:{color:getZoneColor(z.type),weight:4}}).getLayers()[0]; if(l){ l.options.zoneId=z.id; l.on('click',()=>selectZone(z.id)); drawnItems.addLayer(l); } } if(z.lines&&z.lines.length>0) renderZoneLines(z.id,z.lines); }); }
    function sendZoneToMission(zid) { const z=zones.find(z=>z.id===zid); if(!z)return; if(socket&&socket.connected) socket.emit('select_zone_for_mission',{zone_id:zid,zone_data:z}); const sz=JSON.parse(localStorage.getItem('selectedZonesForMission')||'[]'); if(!sz.includes(zid)){ sz.push(zid); localStorage.setItem('selectedZonesForMission',JSON.stringify(sz)); } }
    function saveAllZones() { localStorage.setItem('zones',JSON.stringify(zones)); fetch('/api/zones',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(zones)}).catch(()=>console.log('Sauvegarde locale')); }
    function clearAllZones() { if(!confirm('Tout effacer?'))return; zones=[]; drawnItems.clearLayers(); updateZonesList(); saveAllZones(); }
    function sendROSCommand(cmd) { if(socket&&socket.connected) socket.emit('ros_command',cmd); else fetch('/api/ros_command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cmd)}).catch(console.error); }
    function connectSocket() { socket=io('http://localhost:5000'); socket.on('connect',()=>console.log('✅ Connecté')); socket.on('disconnect',()=>console.log('❌ Déconnecté')); socket.on('zones_updated',d=>{zones=d.zones;if(currentTab==='taches'){renderAllZonesOnMap();updateZonesList();}}); }
    function initMission() {}
    function loadMissionZones() {}
    function initSante() {}
    function updateSystemStatus() { fetch('/api/system_status').then(r=>r.json()).then(d=>{ document.getElementById('cpu-usage').textContent=`${d.cpu}%`; document.getElementById('ram-usage').textContent=`${d.ram}%`; document.getElementById('disk-usage').textContent=`${d.disk}%`; }).catch(()=>{}); }
    function updateRosNodes() {}
    setInterval(()=>{if(currentTab==='sante')updateSystemStatus();},5000);
    setInterval(()=>{if(currentTab==='sante')updateRosNodes();},10000);
  </script>
</body>
</html>
