<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gazonator Control</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: #121212; color: #fff; overflow: hidden; }
        
        nav { display: flex; background: #1e1e1e; border-bottom: 1px solid #333; height: 50px; flex-shrink: 0; }
        nav button { flex: 1; padding: 10px 5px; background: none; border: none; color: #888; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        nav button.active { color: #4caf50; border-bottom: 3px solid #4caf50; background: #2a2a2a; }

        .tab-content { display: none; width: 100%; height: calc(100vh - 50px); position: relative; }
        #tab1.active { display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 20px; }
        #tab2.active { display: flex; flex-direction: column; }
        #tab3.active { display: flex; flex-direction: row; }
        #tab4.active { display: flex; flex-direction: column; padding: 20px; gap: 15px; }

        .map-frame { width: 100%; height: 100%; z-index: 1; background: #1a1a1a; }
        
        .sidebar { width: 340px; background: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; z-index: 2; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .sidebar-top { flex: 1; padding: 15px; overflow-y: auto; border-bottom: 1px solid #333; }
        .sidebar-bottom { padding: 15px; background: #181818; }
        
        .task-item { display: flex; align-items: center; padding: 10px; background: #2a2a2a; border-radius: 5px; margin-bottom: 8px; border: 1px solid #333; }
        .task-item.active-editing { border-color: #4caf50; background: #333; }
        .task-item input[type="checkbox"] { width: auto; margin-right: 10px; cursor: pointer; }
        .task-name-text { flex: 1; color: #ffffff; font-weight: bold; font-size: 0.95rem; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .task-name-text:hover { color: #4caf50; }
        
        .btn-action { background: none; border: none; font-size: 1rem; cursor: pointer; margin-left: 8px; opacity: 0.7; }
        .btn-action:hover { opacity: 1; }

        .btn-add-task { padding: 6px 12px; background: #4caf50; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-add-task:hover { background: #45a049; }

        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .card h3 { color: #4caf50; margin-bottom: 10px; }

        label { display: block; margin-top: 10px; font-size: 0.85rem; color: #aaa; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
    </style>
</head>
<body>

    <nav>
        <button class="active" onclick="switchTab('tab1', event)">1. Pilotage</button>
        <button onclick="switchTab('tab2', event)">2. Mission</button>
        <button onclick="switchTab('tab3', event)">3. Tâches</button>
        <button onclick="switchTab('tab4', event)">4. Santé</button>
    </nav>

    <div id="tab1" class="tab-content active"><p style="margin-top:20px;">Onglet Pilotage</p></div>
    <div id="tab2" class="tab-content"><div id="map-mission" class="map-frame"></div></div>

    <div id="tab3" class="tab-content">
        <div class="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-header">
                    <h4>Tâches & Zones</h4>
                    <button class="btn-add-task" onclick="createNewTask()">+ Nouvelle Tâche</button>
                </div>
                <div id="tasks-list"></div>
            </div>
            <div class="sidebar-bottom">
                <h4>Réglages de la Zone</h4>
                <label>Nom de la tâche</label>
                <input type="text" id="task-name" value="Nouvelle Zone">
                <label>Nombre de tournières</label>
                <input type="number" id="param-tours" value="2" min="1" max="5">
                <label>Largeur de passe / outil (m)</label>
                <input type="number" id="param-largeur" value="0.4" step="0.05">
                
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button onclick="generateTrajectory()" style="flex:1; padding: 10px; background: #2196f3; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Calculer</button>
                    <button onclick="saveCurrentTask()" style="flex:1; padding: 10px; background: #4caf50; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Sauvegarder</button>
                </div>
            </div>
        </div>
        <div id="map-editor" class="map-frame"></div>
    </div>

    <div id="tab4" class="tab-content">
        <div class="card">
            <h3>Raspberry Pi</h3>
            <p>CPU : <span id="sys-cpu">-</span> % (<span id="sys-temp">-</span> °C)</p>
            <p>RAM : <span id="sys-ram">-</span> MB / <span id="sys-ram-total">-</span> MB</p>
            <p>SD Libre : <span id="sys-sd">-</span> GB</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    <script>
        function switchTab(tabId, evt) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
            setTimeout(() => { mapMission.invalidateSize(); mapEditor.invalidateSize(); }, 100);
        }

        const mapOptions = { maxZoom: 22, maxNativeZoom: 19 };
        const orthoLayer = () => L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', mapOptions);

        const mapMission = L.map('map-mission', mapOptions).setView([47.0, 5.0], 18);
        orthoLayer().addTo(mapMission);

        const mapEditor = L.map('map-editor', mapOptions).setView([47.0, 5.0], 18);
        orthoLayer().addTo(mapEditor);

        let trajectoryLayerGroup = L.layerGroup().addTo(mapEditor);
        let currentPolygon = null;
        let exclusionPolygons = [];
        let currentTaskId = null;
        let loadedWaypoints = null;

        mapEditor.pm.setGlobalOptions({ snapDistance: 3, allowSelfIntersection: false });
        mapEditor.pm.addControls({
            position: 'topleft',
            drawPolygon: true, editMode: true, dragMode: true, removalMode: true,
            drawCircle: false, drawPolyline: false, drawRectangle: false, drawCircleMarker: false, drawText: false, cutPolygon: false
        });

        mapEditor.on('pm:create', (e) => {
            if (e.shape !== 'Polygon') return;
            
            if (!currentPolygon) {
                currentPolygon = e.layer;
                currentPolygon.setStyle({ color: '#3388ff' });
            } else {
                e.layer.setStyle({ color: '#ff5252' });
                exclusionPolygons.push(e.layer);
            }
        });

        function createNewTask() {
            currentTaskId = null;
            if (currentPolygon) mapEditor.removeLayer(currentPolygon);
            exclusionPolygons.forEach(p => mapEditor.removeLayer(p));
            currentPolygon = null;
            exclusionPolygons = [];
            loadedWaypoints = null;
            trajectoryLayerGroup.clearLayers();

            document.getElementById('task-name').value = "Zone " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('param-tours').value = 2;
            document.getElementById('param-largeur').value = 0.4;

            loadTasksList();
        }

        async function generateTrajectory() {
            if (!currentPolygon) return alert("Veuillez d'abord dessiner une zone principale bleue.");
            
            const payload = {
                tours: document.getElementById('param-tours').value,
                largeur: document.getElementById('param-largeur').value,
                polygon: currentPolygon.getLatLngs()[0],
                exclusions: exclusionPolygons.map(p => p.getLatLngs()[0])
            };

            const res = await fetch('/api/generate_path', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.status === 'success') {
                loadedWaypoints = data.waypoints;
                drawWaypoints(loadedWaypoints);
            } else {
                alert("Erreur de génération : " + data.message);
            }
        }

        function drawWaypoints(waypoints) {
            trajectoryLayerGroup.clearLayers();
            waypoints.forEach(item => {
                if (item.type === 'headland' || item.type === 'exclusion_headland') {
                    const coords = item.points.map(p => [p.lat, p.lng]);
                    L.polyline(coords, { color: '#ff9800', weight: 2, dashArray: '4, 4' }).addTo(trajectoryLayerGroup);
                } else if (item.type === 'swaths') {
                    item.lines.forEach(line => {
                        const coords = line.map(p => [p.lat, p.lng]);
                        L.polyline(coords, { color: '#2196f3', weight: 2 }).addTo(trajectoryLayerGroup);
                    });
                }
            });
        }

        async function saveCurrentTask() {
            if (!currentPolygon) return alert("Aucune zone à sauvegarder.");
            const taskId = currentTaskId || 'task_' + Date.now();
            
            const taskData = {
                id: taskId,
                name: document.getElementById('task-name').value,
                enabled: true,
                params: {
                    tours: document.getElementById('param-tours').value,
                    largeur: document.getElementById('param-largeur').value
                },
                polygon: currentPolygon.getLatLngs()[0],
                exclusions: exclusionPolygons.map(p => p.getLatLngs()[0]),
                waypoints: loadedWaypoints
            };

            await fetch(`/api/tasks/${taskId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(taskData)
            });

            currentTaskId = taskId;
            loadTasksList();
            alert("Tâche sauvegardée !");
        }

        async function loadTasksList() {
            const res = await fetch('/api/tasks');
            const tasks = await res.json();
            const container = document.getElementById('tasks-list');
            container.innerHTML = '';

            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = 'task-item' + (task.id === currentTaskId ? ' active-editing' : '');
                
                div.innerHTML = `
                    <input type="checkbox" ${task.enabled ? 'checked' : ''} onchange="toggleTaskEnabled('${task.id}', this.checked)" title="Activer pour la mission">
                    <span class="task-name-text" onclick="focusAndLoadTask('${task.id}')">${task.name}</span>
                    <button class="btn-action" onclick="renameTask('${task.id}', '${task.name}')" title="Renommer">✏️</button>
                    <button class="btn-action" onclick="deleteTask('${task.id}')" title="Supprimer">🗑️</button>
                `;
                container.appendChild(div);
            });
        }

        async function focusAndLoadTask(taskId) {
            const res = await fetch('/api/tasks');
            const tasks = await res.json();
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            currentTaskId = task.id;
            document.getElementById('task-name').value = task.name;
            document.getElementById('param-tours').value = task.params.tours;
            document.getElementById('param-largeur').value = task.params.largeur;

            if (currentPolygon) mapEditor.removeLayer(currentPolygon);
            exclusionPolygons.forEach(p => mapEditor.removeLayer(p));
            exclusionPolygons = [];
            trajectoryLayerGroup.clearLayers();

            currentPolygon = L.polygon(task.polygon, { color: '#3388ff' }).addTo(mapEditor);

            if (task.exclusions) {
                task.exclusions.forEach(ex => {
                    const p = L.polygon(ex, { color: '#ff5252' }).addTo(mapEditor);
                    exclusionPolygons.push(p);
                });
            }

            if (task.waypoints) {
                loadedWaypoints = task.waypoints;
                drawWaypoints(loadedWaypoints);
            }

            mapEditor.fitBounds(currentPolygon.getBounds(), { padding: [30, 30] });

            loadTasksList();
        }

        async function toggleTaskEnabled(taskId, enabled) {
            const res = await fetch('/api/tasks');
            const tasks = await res.json();
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.enabled = enabled;
                await fetch(`/api/tasks/${taskId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(task)
                });
            }
        }

        async function renameTask(taskId, currentName) {
            const newName = prompt("Nouveau nom :", currentName);
            if (!newName) return;
            const res = await fetch('/api/tasks');
            const tasks = await res.json();
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.name = newName;
                await fetch(`/api/tasks/${taskId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(task)
                });
                if (taskId === currentTaskId) {
                    document.getElementById('task-name').value = newName;
                }
                loadTasksList();
            }
        }

        async function deleteTask(taskId) {
            if (!confirm("Supprimer cette zone ?")) return;
            await fetch(`/api/tasks/${taskId}`, { method: 'DELETE' });
            if (taskId === currentTaskId) {
                createNewTask();
            } else {
                loadTasksList();
            }
        }

        loadTasksList();
    </script>
</body>
</html>
